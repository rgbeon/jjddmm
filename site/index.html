<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados JJDDMM</title>
<meta name="theme-color" content="#1f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resultados">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f3; --card:#fff; --ink:#15201a; --mute:#5d6b62; --line:#e2e7e2;
  --pitch:#1f6b3a; --pitch-2:#2d8a4e; --accent:#f2b705;
  --win:#1f8a4c; --draw:#8a8f2a; --loss:#c0392b; --chip:#eef2ee;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --card:#18201b; --ink:#e8efe9; --mute:#9aa89f; --line:#2a352e; --chip:#222c25;
    --pitch:#1b5e33; --pitch-2:#247a43; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(135deg,var(--pitch),var(--pitch-2));color:#fff;padding:22px 0 18px;margin-bottom:-28px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 40px,transparent 40px 80px),linear-gradient(135deg,var(--pitch),var(--pitch-2))}
header .wrap{padding-bottom:30px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
h1{font:700 34px/1 'Barlow Condensed',sans-serif;margin:6px 0 8px;letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:rgba(255,255,255,.14);border-radius:99px;padding:3px 10px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
h2{font:700 20px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font:500 12px Inter,sans-serif;text-transform:none;letter-spacing:0;color:var(--mute)}
.next{border-left:5px solid var(--accent)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin:6px 0 12px}
.vs .t{font:700 19px/1.1 'Barlow Condensed',sans-serif}
.vs .t.me{color:var(--pitch-2)}
.vs .x{font:700 14px Inter;color:var(--mute)}
.when{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;color:var(--mute);font-size:14px}
.when b{color:var(--ink)}
.count{display:inline-block;background:var(--accent);color:#1a1a1a;font-weight:600;border-radius:99px;padding:2px 10px;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600;text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:9px 4px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.tm,th.tm{text-align:left}
tr.me td{background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:600}
td.pts{font-weight:700}
.pos{display:inline-block;width:22px;color:var(--mute)}
.hide-s{display:table-cell}
@media (max-width:520px){.hide-s{display:none}}
.form{display:flex;gap:4px;justify-content:center}
.dot{width:20px;height:20px;border-radius:5px;color:#fff;font:600 11px/20px Inter;text-align:center}
.W{background:var(--win)}.D{background:var(--draw)}.L{background:var(--loss)}
.match{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.jn{font:700 15px 'Barlow Condensed';color:var(--mute);text-align:center;background:var(--chip);border-radius:8px;padding:6px 0}
.teams{font-size:14px}
.teams .me{font-weight:700}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.score{font:700 20px 'Barlow Condensed';min-width:52px;text-align:center;border-radius:8px;padding:2px 8px}
.score.W{color:#fff}.score.D{color:#fff}.score.L{color:#fff}
.score.n{background:var(--chip)}
.score.p{font:500 13px Inter;color:var(--mute);background:var(--chip)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:6px 10px;font:600 13px Inter;cursor:pointer}
.tabs button.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.tabs button.done{border-color:color-mix(in srgb,var(--pitch-2) 50%,var(--line))}
.foot{color:var(--mute);font-size:12.5px;margin-top:18px;text-align:center}
.foot a{color:var(--pitch-2)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:none;color:var(--mute);border-radius:99px;padding:4px 12px;font:500 13px Inter;cursor:pointer}
.picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative}
.picker a{background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;border-radius:99px;padding:5px 12px;font:600 13px Inter}
.picker a.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="kicker" id="kick"></div>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</div></header>
<main class="wrap">
  <nav class="picker" id="picker" hidden></nav>
  <div class="card" id="err" hidden></div>
  <section class="card next" id="next"></section>
  <section class="card">
    <h2>Clasificación <small id="clasNote"></small></h2>
    <table id="clas"></table>
  </section>
  <section class="card">
    <h2>Nuestros partidos <small id="ourNote"></small></h2>
    <div class="seg" id="seg"><button data-f="all" class="on">Todos</button><button data-f="played">Jugados</button><button data-f="next">Pendientes</button></div>
    <div id="ours"></div>
  </section>
  <section class="card">
    <h2>Jornada a jornada <small>todo el grupo</small></h2>
    <div class="tabs" id="tabs"></div>
    <div id="jor"></div>
  </section>
  <p class="foot" id="foot"></p>
</main>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script>
</body>
</html>
