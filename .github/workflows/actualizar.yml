name: Actualizar resultados

on:
  schedule:
    # Lunes a las 10:00 en Sevilla en invierno (09:00 UTC). En verano (UTC+2) serían las 11:00.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}          # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      # Si el IMD no responde (bloquea IPs de fuera de España), se publica igualmente
      # la web con los últimos datos guardados en el repo.
      - name: Consultar IMD
        id: scrape
        continue-on-error: true
        run: npm run scrape

      - name: Guardar datos en el repo (historial de cambios)
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name  "jdm-bot"
          git config user.email "jdm-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Resultados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
